<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Form - University ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="bg-glow-blue"></div>
<div class="bg-glow-purple"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="glass-card p-4 p-md-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="fw-bold brand-gradient mb-0" th:text="${user.username == null or user.username == '' ? 'Create New User' : 'Update User'}">User Form</h3>
                    <a class="btn btn-glass-secondary btn-sm" th:href="@{/users}"><i class="fa-solid fa-arrow-left me-1"></i> Back</a>
                </div>

                <form method="post" th:action="@{/users/save}" th:object="${user}">
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-medium">Username</label>
                        <input class="form-control glass-input" placeholder="Enter username" required th:field="*{username}" th:readonly="${user.username != null and user.username != ''}" type="text"/>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-medium">Password</label>
                        <input class="form-control glass-input" placeholder="Enter password" required th:field="*{password}" type="password"/>
                    </div>

                    <div class="mb-4 form-check">
                        <input class="form-check-input" id="enabledCheck" th:field="*{enabled}" type="checkbox"/>
                        <label class="form-check-label text-light small fw-medium" for="enabledCheck">Account Enabled</label>
                    </div>

                    <button class="btn btn-glass-primary w-100 py-2 fw-semibold" type="submit">
                        <i class="fa-solid fa-floppy-disk me-1"></i> Save User Account
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
