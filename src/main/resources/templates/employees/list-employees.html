<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Directory - University ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="bg-glow-blue"></div>
<div class="bg-glow-purple"></div>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold brand-gradient mb-1"><i class="fa-solid fa-user-tie me-2"></i>Employee Directory</h2>
            <p class="text-secondary small mb-0">Manage university corporate employees and staff records</p>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-glass-secondary btn-sm" th:href="@{/}"><i class="fa-solid fa-house me-1"></i> Home</a>
            <a class="btn btn-glass-primary btn-sm" th:href="@{/employees/showFormForAdd}"><i class="fa-solid fa-plus me-1"></i> Add Employee</a>
        </div>
    </div>

    <div class="glass-card p-4">
        <div class="table-responsive">
            <table class="table glass-table align-middle text-center">
                <thead>
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="employee : ${employees}">
                    <td th:text="${employee.firstName}" class="fw-medium">First</td>
                    <td th:text="${employee.lastName}">Last</td>
                    <td th:text="${employee.email}" class="text-secondary">email@company.com</td>
                    <td>
                        <a class="btn btn-glass-secondary btn-sm me-1" th:href="@{/employees/showFormForUpdate(employeeId=${employee.id})}">
                            <i class="fa-solid fa-pen-to-square me-1"></i>Edit
                        </a>
                        <a class="btn btn-glass-danger btn-sm" onclick="if (!(confirm('Are you sure you want to delete this employee?'))) return false" th:href="@{/employees/delete(employeeId=${employee.id})}">
                            <i class="fa-solid fa-trash me-1"></i>Delete
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
