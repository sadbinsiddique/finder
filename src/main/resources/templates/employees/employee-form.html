<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Form - University ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="bg-glow-blue"></div>
<div class="bg-glow-purple"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="glass-card p-4 p-md-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="fw-bold brand-gradient mb-0"><i class="fa-solid fa-user-tie me-2"></i>Save Employee</h3>
                    <a class="btn btn-glass-secondary btn-sm" th:href="@{/employees/list}"><i class="fa-solid fa-arrow-left me-1"></i> Back</a>
                </div>

                <form method="post" th:action="@{/employees/save}" th:object="${employee}">
                    <input th:field="*{id}" type="hidden"/>

                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-medium">First Name</label>
                        <input class="form-control glass-input" th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'" placeholder="Enter first name" th:field="*{firstName}" type="text" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}">Invalid First Name</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-medium">Last Name</label>
                        <input class="form-control glass-input" th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'" placeholder="Enter last name" th:field="*{lastName}" type="text" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}">Invalid Last Name</div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-secondary small fw-medium">Email Address</label>
                        <input class="form-control glass-input" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" placeholder="name@company.com" th:field="*{email}" type="text" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Please enter a valid email address</div>
                    </div>

                    <button class="btn btn-glass-primary w-100 py-2 fw-semibold" type="submit">
                        <i class="fa-solid fa-floppy-disk me-1"></i> Save Employee Record
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
