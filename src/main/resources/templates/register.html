<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - University ERP</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%2330D158' d='M512 256C512 397.4 397.4 512 256 512C114.6 512 0 397.4 0 256C0 114.6 114.6 0 256 0C397.4 0 512 114.6 512 256zM256 48C141.1 48 48 141.1 48 256C48 285.2 54.02 313.1 64.9 338.3C77.46 322.9 96.79 313.3 118.2 313.3H144C161.7 313.3 176 298.1 176 281.3V256C176 238.3 190.3 224 208 224H256C273.7 224 288 209.7 288 192V160C288 142.3 302.3 128 320 128H336C344.8 128 352 120.8 352 112V92.29C322.7 64.08 283.4 48 256 48z'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        :root {
            --bg-color: #07090e;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-inner-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.15);
            --apple-blue: #0A84FF;
            --apple-purple: #5E5CE6;
            --apple-green: #30D158;
            --text-primary: #F5F5F7;
            --text-secondary: rgba(245, 245, 247, 0.55);
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 15%, rgba(10, 132, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(94, 92, 230, 0.07) 0%, transparent 45%),
                radial-gradient(circle at 15% 85%, rgba(48, 209, 88, 0.06) 0%, transparent 45%);
            background-attachment: fixed;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 2rem 1rem;
            -webkit-font-smoothing: antialiased;
        }

        .register-card {
            background: var(--glass-bg);
            backdrop-filter: blur(30px) saturate(190%);
            -webkit-backdrop-filter: blur(30px) saturate(190%);
            border: 1px solid var(--glass-border);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), var(--glass-inner-shadow);
            border-radius: 24px;
            padding: 2.75rem 2.25rem;
            width: 100%;
            max-width: 480px;
        }

        .logo-glow {
            color: var(--apple-blue);
            filter: drop-shadow(0 0 14px rgba(10, 132, 255, 0.8));
        }

        .brand-icon {
            width: 60px;
            height: 60px;
            border-radius: 18px;
            background: rgba(10, 132, 255, 0.12);
            border: 1px solid rgba(10, 132, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
        }

        .form-label {
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.4rem;
        }

        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #fff;
            padding: 11px 14px;
            font-size: 0.95rem;
        }

        .form-control:focus, .form-select:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--apple-blue);
            box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.2);
            color: #fff;
        }

        .form-select option {
            background: #0d1117;
            color: #fff;
        }

        .btn-apple-primary {
            background: var(--apple-blue);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 14px rgba(10, 132, 255, 0.35), var(--glass-inner-shadow);
            color: #fff;
            border-radius: 12px;
            padding: 12px;
            font-weight: 500;
            width: 100%;
            transition: all 0.25s ease;
        }

        .btn-apple-primary:hover {
            background: #0071e3;
            color: #fff;
            transform: translateY(-1px);
        }

        .alert-glass-danger {
            background: rgba(255, 69, 58, 0.12);
            border: 1px solid rgba(255, 69, 58, 0.25);
            color: #FF6B60;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 0.85rem;
        }

        .invalid-feedback {
            font-size: 0.8rem;
            color: #FF6B60;
            margin-top: 0.35rem;
        }
    </style>
</head>
<body>

<div class="register-card text-center">
    <div class="brand-icon">
        <i class="fas fa-user-plus logo-glow fs-3"></i>
    </div>
    <h1 class="h3 fw-bold text-white mb-1">Create Account</h1>
    <p class="text-secondary small mb-4">Register your account in the University ERP.</p>

    <div th:if="${errorMessage}" class="alert alert-glass-danger text-start mb-3" role="alert">
        <i class="fas fa-exclamation-circle me-1"></i> <span th:text="${errorMessage}">Error</span>
    </div>

    <form th:action="@{/register}" th:object="${registerRequest}" method="post" class="text-start">
        <div class="mb-3">
            <label for="usernameInput" class="form-label">Username</label>
            <div class="input-group">
                <input id="usernameInput" type="text" th:field="*{username}" class="form-control"
                       th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                       placeholder="e.g. jdoe" required autofocus/>
            </div>
            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
        </div>

        <div class="mb-3">
            <label for="emailInput" class="form-label">Email Address</label>
            <div class="input-group">
                <input id="emailInput" type="email" th:field="*{email}" class="form-control"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                       placeholder="e.g. jdoe@university.edu" required/>
            </div>
            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="mb-3">
            <label for="passwordInput" class="form-label">Password</label>
            <div class="input-group">
                <input id="passwordInput" type="password" th:field="*{password}" class="form-control"
                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                       placeholder="Enter password (min 4 characters)" required/>
            </div>
            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>

        <div class="mb-3">
            <label for="confirmPasswordInput" class="form-label">Confirm Password</label>
            <div class="input-group">
                <input id="confirmPasswordInput" type="password" th:field="*{confirmPassword}" class="form-control"
                       th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                       placeholder="Re-enter password" required/>
            </div>
            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
        </div>

        <div class="mb-4">
            <label for="roleSelect" class="form-label">Account Role</label>
            <select id="roleSelect" th:field="*{roleName}" class="form-select">
                <option value="ROLE_STUDENT">Student</option>
                <option value="ROLE_INSTRUCTOR">Instructor / Faculty</option>
            </select>
        </div>

        <button type="submit" class="btn btn-apple-primary mb-3">
            <i class="fas fa-user-check me-1"></i> Register Account
        </button>

        <div class="text-center">
            <span class="text-secondary small">Already have an account? </span>
            <a th:href="@{/login}" class="small text-decoration-none fw-medium" style="color: var(--apple-blue);">Sign In</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
