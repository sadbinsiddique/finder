<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Roles - University ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="bg-glow-blue"></div>
<div class="bg-glow-purple"></div>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold brand-gradient mb-1"><i class="fa-solid fa-user-shield me-2"></i>System Roles</h2>
            <p class="text-secondary small mb-0">Manage application security roles and authority assignments</p>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-glass-secondary btn-sm" th:href="@{/}"><i class="fa-solid fa-house me-1"></i> Home</a>
            <a class="btn btn-glass-primary btn-sm" th:href="@{/roles/new}"><i class="fa-solid fa-plus me-1"></i> Add Role</a>
        </div>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show bg-success-subtle text-success border-0 mb-4" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show bg-danger-subtle text-danger border-0 mb-4" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="glass-card p-4">
        <div class="table-responsive">
            <table class="table glass-table align-middle text-center">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Role Name</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="role : ${roles}">
                    <td th:text="${role.id}" class="fw-semibold text-secondary">1</td>
                    <td><span th:text="${role.roleName}" class="badge-status badge-role">ROLE_ADMIN</span></td>
                    <td>
                        <a class="btn btn-glass-secondary btn-sm me-1" th:href="@{/roles/edit/{id}(id=${role.id})}">
                            <i class="fa-solid fa-pen-to-square me-1"></i>Edit
                        </a>
                        <a class="btn btn-glass-danger btn-sm" onclick="return confirm('Are you sure you want to delete this role?')" th:href="@{/roles/delete/{id}(id=${role.id})}">
                            <i class="fa-solid fa-trash me-1"></i>Delete
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
