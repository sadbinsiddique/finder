<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Role Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 th:text="${role.id == null ? 'Create New Role' : 'Update Role'}"></h2>
    <hr/>

    <form class="mt-4" method="post" style="max-width: 500px;" th:action="@{/roles/save}" th:object="${role}">

        <!-- Hidden field to retain the ID for updates -->
        <input th:field="*{id}" type="hidden"/>

        <div class="mb-3">
            <label class="form-label fw-bold">Role Name</label>
            <input class="form-control" placeholder="e.g., ROLE_ADMIN, ROLE_USER" required th:field="*{roleName}"
                   type="text"/>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold d-block">Assigned Permissions</label>
            <div class="row g-2 p-2 border rounded" style="max-height: 200px; overflow-y: auto;">
                <div class="col-md-6" th:each="perm : ${allPermissions}">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" 
                               name="permissionIds" 
                               th:value="${perm.id}" 
                               th:id="${'perm_' + perm.id}"
                               th:checked="${role.permissions != null and role.permissions.contains(perm)}"/>
                        <label class="form-check-label small" th:for="${'perm_' + perm.id}" th:text="${perm.permissionName}">PERM_NAME</label>
                    </div>
                </div>
                <div th:if="${#lists.isEmpty(allPermissions)}" class="col-12 text-muted small fst-italic">
                    No system permissions available
                </div>
            </div>
        </div>


        <div class="mt-4">
            <button class="btn btn-success" type="submit">Save Role</button>
            <a class="btn btn-secondary" th:href="@{/roles}">Cancel</a>
        </div>
    </form>

</div>
</body>
</html>
