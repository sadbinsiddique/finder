<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Role Form - University ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="bg-glow-blue"></div>
<div class="bg-glow-purple"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="glass-card p-4 p-md-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="fw-bold brand-gradient mb-0" th:text="${role.id == null ? 'Create New Role' : 'Update Role'}">Role Form</h3>
                    <a class="btn btn-glass-secondary btn-sm" th:href="@{/roles}"><i class="fa-solid fa-arrow-left me-1"></i> Back</a>
                </div>

                <form method="post" th:action="@{/roles/save}" th:object="${role}">
                    <input th:field="*{id}" type="hidden"/>

                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-medium">Role Name</label>
                        <input class="form-control glass-input" placeholder="e.g. ROLE_ADMIN, ROLE_USER" required th:field="*{roleName}" type="text"/>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-secondary small fw-medium d-block">Assigned Permissions</label>
                        <div class="p-3 border border-secondary border-opacity-25 rounded-3 style-scroll" style="max-height: 200px; overflow-y: auto; background: rgba(255,255,255,0.02);">
                            <div class="row g-2">
                                <div class="col-6" th:each="perm : ${allPermissions}">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="permissionIds" th:value="${perm.id}" th:id="${'perm_' + perm.id}" th:checked="${role.permissions != null and role.permissions.contains(perm)}"/>
                                        <label class="form-check-label small text-light" th:for="${'perm_' + perm.id}" th:text="${perm.permissionName}">PERM_NAME</label>
                                    </div>
                                </div>
                                <div th:if="${#lists.isEmpty(allPermissions)}" class="col-12 text-secondary small fst-italic">
                                    No system permissions available
                                </div>
                            </div>
                        </div>
                    </div>

                    <button class="btn btn-glass-primary w-100 py-2 fw-semibold" type="submit">
                        <i class="fa-solid fa-floppy-disk me-1"></i> Save Role
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
