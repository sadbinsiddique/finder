spring.application.name=FinderTest

# -----------------------------------------------------
# TEST DATABASE CONFIGURATION (H2 In-Memory)
# -----------------------------------------------------
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# -----------------------------------------------------
# TEST CACHE & LOGGING
# -----------------------------------------------------
spring.cache.type=concurrent

# -----------------------------------------------------
# OPENWEATHERMAP API MOCK SETTINGS FOR TESTS
# -----------------------------------------------------
weather.api.enabled=true
weather.api.key=160480b8458128540fbe2c0ee1e593a1
weather.api.url=https://api.openweathermap.org/data/2.5/weather
weather.api.default-city=Dhaka
